# Hacer reload de la configuración de tmux con Ctrl + B, R
unbind r
bind r source-file ~/.tmux.conf \; display "Configuración cargada"

# Habilitar mouse en tmux
set -g mouse on

# Habilitar modo vi en tmux
setw -g mode-keys vi

# Cambiar base index de 0 a 1
set -g base-index 1

# Cambiar posición del status bar a la parte superior
set-option -g status-position top

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Refresh status bar cada 5 segundos
set -g status-interval 5

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# --- Catppuccin base config ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# --- Catppuccin built-in modules (right) ---
set -g @catppuccin_status_modules_right "directory session"

# Initialize TMUX plugin manager (MUST be before custom modules)
run '~/.tmux/plugins/tpm/tpm'

# =============================================
# Custom Catppuccin modules (after TPM init)
# =============================================

# --- Custom: Git Branch ---
%hidden MODULE_NAME="gitbranch"
set -ogq "@catppuccin_${MODULE_NAME}_icon" " "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_teal}"
set -ogq "@catppuccin_${MODULE_NAME}_text" "#(~/.tmux/scripts/tmux-git-branch.sh '#{pane_current_path}')"
source ~/.tmux/plugins/tmux/utils/status_module.conf

# --- Custom: Short Directory ---
%hidden MODULE_NAME="shortdir"
set -ogq "@catppuccin_${MODULE_NAME}_icon" " "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_sky}"
set -ogq "@catppuccin_${MODULE_NAME}_text" "#(~/.tmux/scripts/tmux-dir.sh '#{pane_current_path}')"
source ~/.tmux/plugins/tmux/utils/status_module.conf

# --- Assemble status bar ---
# Left: window list (default catppuccin)
# Right: custom modules + session
set -g status-right "#{E:@catppuccin_status_gitbranch}#{E:@catppuccin_status_shortdir}#{E:@catppuccin_status_session}"
